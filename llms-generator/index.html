<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Suite .Pro - llms.txt Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PAGE-LEVEL FAQ SCHEMA FOR SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is an llms.txt file?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An llms.txt file is a standardized markdown file that helps Large Language Models (LLMs) and AI crawlers inspect and understand your website key documentation."
          }
        },
        {
          "@type": "Question",
          "name": "Where should I place the llms.txt file?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Upload the generated llms.txt file to the root directory of your website (e.g., https://yourdomain.com/llms.txt)."
          }
        }
      ]
    }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #070913; color: #ffffff; min-height: 100vh; padding: 30px 20px; position: relative; }

        .floating-ad-widget { position: fixed; top: 20px; right: 20px; background-color: #171b26; border: 1px solid #2a3142; border-radius: 10px; padding: 12px; max-width: 380px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); z-index: 9999; }
        .badge-count { position: absolute; top: -8px; right: -8px; background-color: #ff2a5f; color: #fff; font-size: 11px; font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .ad-content { display: flex; gap: 12px; align-items: center; }
        .ad-img-box img { width: 55px; height: 55px; border-radius: 6px; object-fit: cover; }
        .ad-title { font-size: 0.8rem; font-weight: 600; color: #e2e8f0; line-height: 1.3; margin-bottom: 6px; }
        .ad-footer { display: flex; justify-content: space-between; font-size: 0.75rem; }
        .ad-link-text { color: #93c5fd; font-weight: 600; cursor: pointer; }
        .ad-hide { color: #64748b; cursor: pointer; }

        .top-header { display: flex; justify-content: flex-start; align-items: center; max-width: 850px; margin: 0 auto 30px auto; }
        .brand-container { display: flex; align-items: center; gap: 12px; }
        .brand-logo-icon { background: linear-gradient(135deg, #a82858, #e11d48); width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #ffffff; }
        .brand-name { font-size: 1.6rem; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }
        .brand-pro { color: #ff3b6b; }

        .main-wrapper { max-width: 850px; margin: 0 auto; }
        .hero-section { text-align: center; margin-bottom: 25px; }
        .gradient-title { font-size: 2.3rem; font-weight: 800; background: linear-gradient(90deg, #ff6b52, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .hero-subtitle { color: #94a3b8; font-size: 0.95rem; }

        .tool-card { background-color: #0d121f; border: 1px solid #1e2738; border-radius: 16px; padding: 30px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); }
        .form-group { margin-bottom: 20px; }
        .input-label { display: block; font-size: 0.88rem; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
        .dark-input, .dark-textarea { width: 100%; background-color: #05070e; border: 1px solid #1a2333; border-radius: 10px; color: #e2e8f0; padding: 12px 16px; font-size: 0.9rem; outline: none; transition: border 0.2s; }
        .dark-input:focus, .dark-textarea:focus { border-color: #f59e0b; }
        .dark-textarea { height: 220px; font-family: monospace; resize: vertical; }
        .small-textarea { height: 90px; }

        .gradient-btn { width: 100%; background: linear-gradient(90deg, #ff4155 0%, #f59e0b 100%); border: none; border-radius: 12px; color: #ffffff; font-size: 1.05rem; font-weight: 700; padding: 16px; cursor: pointer; margin-top: 10px; margin-bottom: 20px; transition: opacity 0.2s; box-shadow: 0 6px 20px rgba(255, 65, 85, 0.3); }
        .gradient-btn:hover { opacity: 0.92; }
        .copy-code-btn { background-color: #1e293b; color: #ffffff; border: 1px solid #334155; padding: 8px 16px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; margin-top: 8px; }

        .ad-banner-section { max-width: 850px; margin: 30px auto 0 auto; }
        .ad-placeholder-box { border: 1px dashed #2d3748; background-color: #0d121f; padding: 20px; text-align: center; color: #64748b; font-size: 0.8rem; font-weight: 600; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="floating-ad-widget">
        <span class="badge-count">1</span>
        <div class="ad-content">
            <div class="ad-img-box"><img src="https://via.placeholder.com/60" alt="Ad Thumbnail"></div>
            <div class="ad-text-box">
                <p class="ad-title">"Don't worry, here's how to SAVE your FB account if it was hacked"</p>
                <div class="ad-footer">
                    <span class="ad-link-text">Click Here</span>
                    <span class="ad-hide" onclick="this.parentElement.parentElement.parentElement.parentElement.style.display='none'">Hide</span>
                </div>
            </div>
        </div>
    </div>

    <header class="top-header">
        <div class="brand-container">
            <div class="brand-logo-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <div class="brand-name">SEO Suite <span class="brand-pro">.Pro</span></div>
        </div>
    </header>

    <main class="main-wrapper">
        <div class="hero-section">
            <h1 class="gradient-title">llms.txt Standard Builder</h1>
            <p class="hero-subtitle">Create standardized markdown discovery files for AI Search Agents & LLMs.</p>
        </div>

        <div class="tool-card">
            <div class="form-group">
                <label class="input-label">Enter Website / Project Name:</label>
                <input type="text" id="siteName" class="dark-input" placeholder="e.g. ErrorFixApp Studio">
            </div>

            <div class="form-group">
                <label class="input-label">Enter Project Summary:</label>
                <textarea id="siteSummary" class="dark-textarea small-textarea" placeholder="Brief description of what your platform does for LLMs..."></textarea>
            </div>

            <div class="form-group">
                <label class="input-label">Enter Documentation Links (Format: Title > URL):</label>
                <textarea id="siteLinks" class="dark-textarea small-textarea" placeholder="Getting Started > https://example.com/start&#10;API Documentation > https://example.com/api"></textarea>
            </div>

            <button type="button" class="gradient-btn" onclick="generateLLMSTXT()">Generate llms.txt File</button>

            <div class="output-wrapper">
                <label class="input-label">Generated llms.txt Content:</label>
                <textarea id="llmsOutput" class="dark-textarea" readonly placeholder="# Output llms.txt content will appear here..."></textarea>
                <button type="button" class="copy-code-btn" onclick="copyText('llmsOutput')">Copy File Content</button>
            </div>
        </div>
    </main>

    <div class="ad-banner-section">
        <div class="ad-placeholder-box">SPONSORED ADVERTISEMENT AREA</div>
    </div>

    <script>
        function generateLLMSTXT() {
            const name = document.getElementById("siteName").value.trim();
            const summary = document.getElementById("siteSummary").value.trim();
            const linksRaw = document.getElementById("siteLinks").value.trim();

            let text = `# ${name || 'Project Name'}\n\n`;
            if (summary) text += `> ${summary}\n\n`;

            if (linksRaw) {
                text += `## Key Documentation\n`;
                const lines = linksRaw.split('\n');
                lines.forEach(line => {
                    if (line.includes('>')) {
                        const [title, url] = line.split('>').map(item => item.trim());
                        text += `- [${title}](${url})\n`;
                    } else if (line.trim()) {
                        text += `- ${line.trim()}\n`;
                    }
                });
            }

            document.getElementById("llmsOutput").value = text;
        }

        function copyText(id) {
            const textarea = document.getElementById(id);
            if (!textarea.value) return;
            textarea.select();
            navigator.clipboard.writeText(textarea.value);
            alert("Copied to clipboard!");
        }
    </script>
</body>
</html>
